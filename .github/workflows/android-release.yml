name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"

      - name: Resolve build variant
        id: apk
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "file=app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "file=app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Signed with the dedicated keystore when the ANDROID_KEYSTORE_*
      # secrets are configured; otherwise falls back to the debug keystore.
      - name: Build Android APK
        run: cd android && ./gradlew assemble${{ steps.apk.outputs.variant == 'release' && 'Release' || 'Debug' }} --no-daemon

      - name: Publish tag release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/${{ steps.apk.outputs.variant }}/${{ steps.apk.outputs.file }}
          body: |
            Build of `${{ github.ref_name }}`. ${{ env.ANDROID_KEYSTORE_BASE64 != '' && 'Signed with the release keystore.' || 'Unsigned debug-keystore artifact (secrets not configured).' }}

      - name: Publish rolling latest build
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest master build
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/${{ steps.apk.outputs.variant }}/${{ steps.apk.outputs.file }}
          body: |
            Rolling APK built from master (commit ${{ github.sha }}). Assets are replaced on every merge to `master`. ${{ env.ANDROID_KEYSTORE_BASE64 != '' && 'Signed with the release keystore.' || 'Unsigned debug-keystore artifact (secrets not configured).' }}
